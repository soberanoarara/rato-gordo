<!DOCTYPE html>
<html lang="pt" data-theme="dark">
<head>
<meta charset="utf-8">
<title>Manifesty-one | Command Center</title>
<link rel="stylesheet" href="/static/leaflet.css">
<style>
  :root {
    /* Tema Dark (Padrão) - Baseado na imagem */
    --bg: #0a0f1a;
    --surface: #111827;
    --border: #1f2937;
    --primary: #00ffff; /* Ciano neon */
    --text: #e5e7eb;
    --muted: #9ca3af;
    --success: #10b981;
    --danger: #ef4444;
    --font-mono: 'Courier New', monospace;
  }
/* Ecrã de Login */
#login-screen {
  position: fixed;
  top: 0; left: 0; width: 100vw; height: 100vh;
  background-image: url('/static/login.jpg');
  background-size: cover;
  background-position: center;
  display: flex;
  justify-content: center;
  align-items: center;
  z-index: 9999;
}

.login-box {
  position: absolute;
  /* Coordenadas para encaixar na janela desenhada na imagem */
  /* Terás de ajustar estes valores (top e left) conforme a imagem */
  top: 35%; 
  left: 50%;
  transform: translateX(-50%);
  
  width: 350px;
  padding: 20px;
  background: rgba(10, 15, 26, 0.4); /* Fundo transparente escuro */
  border: 2px solid var(--primary); /* Borda ciano */
  box-shadow: 0 0 15px rgba(0, 255, 255, 0.3); /* Brilho ciano */
  border-radius: 8px;
  
  display: flex;
  flex-direction: column;
  gap: 15px;
}

.login-box input {
  width: 100%;
  padding: 10px;
  background: rgba(0, 0, 0, 0.6);
  border: 1px solid var(--primary);
  color: var(--text);
  border-radius: 4px;
  font-family: monospace;
}

.login-box input::placeholder {
  color: rgba(0, 255, 255, 0.5);
}

.login-box button {
  width: 100%;
  padding: 10px;
  background: var(--primary);
  color: #000;
  border: none;
  font-weight: bold;
  border-radius: 4px;
  cursor: pointer;
  transition: 0.2s;
}

.login-box button:hover {
  background: #00cccc;
}

#login-error {
  color: var(--danger);
  font-size: 12px;
  text-align: center;
  display: none;
}
  
  [data-theme="light"] {
    /* Tema Light Alternativo */
    --bg: #f3f4f6;
    --surface: #ffffff;
    --border: #d1d5db;
    --primary: #0891b2; /* Ciano escuro */
    --text: #111827;
    --muted: #6b7280;
  }

  * { box-sizing: border-box; }
  body { margin:0; font-family: system-ui, sans-serif; background:var(--bg); color:var(--text); }
  
  /* Header Fixo */
  header { display:flex; align-items:center; padding:12px 24px; background:var(--surface); border-bottom:2px solid var(--primary); box-shadow: 0 0 15px rgba(0,255,255,0.1); }
  header h1 { font-size:18px; margin:0; letter-spacing:2px; text-transform:uppercase; color:var(--primary); font-family:var(--font-mono); }
  .badge { padding:4px 12px; border-radius:4px; background:var(--border); font-size:12px; margin-left:12px; }
  .badge.on { color:var(--success); border:1px solid var(--success); }
  .badge.off { color:var(--danger); border:1px solid var(--danger); }
  
  /* Botão de Tema */
  #theme-toggle { margin-left:auto; cursor:pointer; background:none; border:1px solid var(--border); color:var(--text); padding:6px 12px; border-radius:4px; }

  /* === VISTA 1: DASHBOARD === */
  #dashboard-view { padding: 24px; display: block; }
  .section-title { font-family: var(--font-mono); color: var(--primary); border-bottom: 1px solid var(--border); padding-bottom: 8px; margin: 24px 0 16px 0; text-transform: uppercase; letter-spacing: 1px; }
  
  .device-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; }
  .device-card { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 16px; cursor: pointer; transition: all 0.2s; position: relative; overflow: hidden; }
  .device-card:hover { border-color: var(--primary); box-shadow: 0 0 20px rgba(0,255,255,0.2); transform: translateY(-2px); }
  .device-card.online { border-left: 4px solid var(--success); }
  .device-card.offline { border-left: 4px solid var(--danger); opacity: 0.7; }
  
  .device-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
  .device-name { font-weight: bold; font-size: 16px; }
  .device-status { font-size: 11px; padding: 2px 8px; border-radius: 12px; background: var(--border); font-family: var(--font-mono); }
  .device-status.online { color: var(--success); border: 1px solid var(--success); }
  
  .device-info { font-size: 12px; color: var(--muted); margin-bottom: 8px; font-family: var(--font-mono); }
  .device-loc { font-size: 11px; color: var(--primary); }
  
  /* === VISTA 2: DETALHE (Gestão Central) === */
  #detail-view { display: none; height: calc(100vh - 60px); padding: 16px; gap: 16px; grid-template-columns: 300px 1fr 400px; grid-template-rows: 1fr; }
  #detail-view.active { display: grid; }
  
  .panel { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; display: flex; flex-direction: column; overflow: hidden; }
  .panel h3 { font-size: 13px; margin: 0; padding: 12px; border-bottom: 1px solid var(--border); color: var(--primary); font-family: var(--font-mono); text-transform: uppercase; }
  
  /* Coluna Esquerda: Info e Log */
  #info-panel { gap: 16px; }
  .info-block { padding: 12px; font-family: var(--font-mono); font-size: 12px; }
  .info-row { display: flex; justify-content: space-between; margin-bottom: 8px; border-bottom: 1px dashed var(--border); padding-bottom: 4px; }
  
  /* Log de Instalação */
  #install-log { flex: 1; background: #000; color: #0f0; font-family: monospace; font-size: 11px; padding: 8px; overflow-y: auto; white-space: pre-wrap; border-radius: 4px; }
  
  /* Coluna Central: Vídeo */
  #video-panel { background: #000; position: relative; }
  #video-container { flex: 1; display: flex; align-items: center; justify-content: center; overflow: hidden; }
  #video-container canvas { max-width: 100%; max-height: 100%; object-fit: contain; cursor: crosshair; }
  
  /* Coluna Direita: Mapa e Histórico */
  #map-panel { gap: 16px; }
  #map-container { flex: 1; background: #000; min-height: 200px; }
  #history-list { height: 200px; overflow-y: auto; font-family: var(--font-mono); font-size: 11px; padding: 8px; }
  .history-item { display: flex; justify-content: space-between; padding: 4px 0; border-bottom: 1px solid var(--border); }
  
  /* Botão Voltar */
  #btn-back { cursor: pointer; background: none; border: 1px solid var(--border); color: var(--primary); padding: 4px 8px; border-radius: 4px; font-size: 12px; margin-bottom: 12px; display: inline-block; }
</style>
</head>
<body>

<div id="login-screen" style="display: flex;">
  <div class="login-box">
    <h2 style="text-align:center; margin:0; color:var(--primary);">ACESSO RESTRITO</h2>
    <input type="text" id="username" placeholder="Utilizador" autocomplete="off">
    <input type="password" id="password" placeholder="Password">
    <button id="btn-login">ENTRAR</button>
    <div id="login-error" style="display:none; color:var(--danger); text-align:center; font-size:12px;">Credenciais inválidas</div>
  </div>
</div>


<header>
  <h1>MAD-Lab</h1>
  <span class="badge" id="conn-badge">a ligar…</span>
  <span class="badge" id="clock"></span>
  <button id="theme-toggle">Alternar Tema</button>
</header>

<!-- VISTA 1: DASHBOARD -->
<div id="dashboard-view">
  <div class="section-title">Dispositivos Online</div>
  <div class="device-grid" id="online-grid">
    <div class="empty" style="color:var(--muted); font-size:13px;">Nenhum dispositivo ligado.</div>
  </div>

  <div class="section-title">Dispositivos Offline (Registados)</div>
  <div class="device-grid" id="offline-grid">
    <div class="empty" style="color:var(--muted); font-size:13px;">Sem registos.</div>
  </div>
</div>

<!-- VISTA 2: DETALHE (Gestão Central) -->
<div id="detail-view">
  
  <!-- Coluna 1: Info e Log -->
  <div class="panel" id="info-panel">
    <h3>Informação do Alvo</h3>
    <button id="btn-back">← Voltar ao Dashboard</button>
    <div class="info-block" id="device-info-content">
      <!-- Preenchido via JS -->
    </div>
    <h3>Log de Instalação</h3>
    <div id="install-log">A aguardar...</div>
  </div>

  <!-- Coluna 2: Vídeo -->
  <div class="panel" id="video-panel">
    <h3>Ecrã do Dispositivo</h3>
    <div id="video-container">
      <span id="video-hint" style="color:var(--muted);">Stream indisponível</span>
    </div>
  </div>

  <!-- Coluna 3: Mapa e Histórico -->
  <div class="panel" id="map-panel">
    <h3>Mapa e Histórico</h3>
    <div id="map-container"></div>
    <div id="history-list">
      <div style="color:var(--muted); text-align:center; padding:10px;">Sem histórico</div>
    </div>
  </div>

</div>

<script src="/static/leaflet.js"></script>
<script src="/static/scrcpy-bundle.js"></script>
<script src="/app.js"></script>
</body>
</html>
